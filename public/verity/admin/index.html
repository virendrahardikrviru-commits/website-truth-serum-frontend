<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>VERITY Administrator Dashboard</title>
  <meta name="theme-color" content="#10243A">
  <link rel="icon" href="../../verity/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="admin-shell" id="admin-shell">
    <!-- Login view -->
    <section class="admin-view" id="view-login" aria-labelledby="login-title">
      <div class="login-card">
        <div class="login-header">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 32 7v10c0 8-5.7 14.2-14 17C9.7 31.2 4 25 4 17V7L18 2Z" fill="currentColor"/><path d="m10.5 17.5 5 5 10-11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h1 id="login-title">VERITY Administrator</h1>
          <p>Secure access to private investigation records.</p>
        </div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="admin-email">Email address</label>
            <input id="admin-email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="admin@example.com">
            <span class="field-error" id="admin-email-error"></span>
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
            <span class="field-error" id="admin-password-error"></span>
          </div>
          <div class="field actions">
            <button type="submit" class="button button-primary button-full" id="login-button">Sign in</button>
          </div>
          <div class="field status" id="login-status" role="alert" aria-live="polite" hidden></div>
        </form>
      </div>
    </section>

    <!-- Dashboard shell (hidden until authenticated) -->
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Main navigation" hidden>
      <div class="sidebar-brand">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 32 7v10c0 8-5.7 14.2-14 17C9.7 31.2 4 25 4 17V7L18 2Z" fill="currentColor"/><path d="m10.5 17.5 5 5 10-11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>VERITY<span class="brand-dot">.</span></span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="#enquiries" data-nav="enquiries"><svg class="icon" aria-hidden="true"><use href="#icon-inbox"/></svg><span>Enquiry Inbox</span></a>
        <a class="nav-link" href="#cases" data-nav="cases"><svg class="icon" aria-hidden="true"><use href="#icon-briefcase"/></svg><span>Cases</span></a>
        <a class="nav-link" href="#logout" data-nav="logout"><svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg><span>Sign out</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="admin-identity" id="sidebar-admin-identity"></span>
      </div>
    </aside>

    <div class="admin-main" id="admin-main">
      <header class="admin-header" id="admin-header">
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-toggle>
          <svg class="icon menu-icon" aria-hidden="true"><use href="#icon-menu"/></svg>
          <svg class="icon close-icon" aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
        <div class="header-title">
          <h2 id="page-title">VERITY Admin</h2>
          <p class="header-subtitle" id="page-subtitle">Private investigation workspace</p>
        </div>
        <div class="header-actions">
          <span class="admin-badge" id="admin-badge"></span>
          <button class="button button-small button-ghost" type="button" id="header-logout" title="Sign out">
            <svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg>
            <span>Sign out</span>
          </button>
        </div>
      </header>

      <main id="main-content" class="admin-content">
        <!-- Views are injected here by admin.js -->
      </main>
    </div>
  </div>

  <!-- Icon sprite (reused symbols, referenced by admin UI) -->
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M3 7v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7L21 3L3 3z"/></symbol>
    <symbol id="icon-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4L19 9l-3 3M9 21V3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9z"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M8 10.5h5M10.5 8v5"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M7 14h10v2H7zM7 8h10v2H7zM3 6h18v2H3z"/></symbol>
    <symbol id="icon-document" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5V6L12 3Z"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 4.1 2.6 17.4A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.6L13.7 4.1a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="icon-building" viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16M2 21h20M8 7h1M15 7h1M8 11h1M15 11h1M8 15h1M15 15h1M10 21v-3h4v3"/></symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M19 2H9C6 2 4 4 4 7v10c0 5 5 9 8 10l2-2c2 2 5 3 8 3s6-1 6-3c0-4-3-8-7-9V7c0-3-2-5-5-5z"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M21 4l-3 3M3 21l2-2 16-16 2 2zM1 18h2l5-5 12 12v2z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M16 9v10H8V9M19 4v15.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5V4z"/></symbol>
    <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5M12 13h2"/></symbol>
    <symbol id="icon-bar-chart" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 13h2v8H7zM11 11h2v10h-2zM15 7h2v14h-2z"/></symbol>
  </svg>

  <!-- Dialog templates for confirmations -->
  <dialog id="confirm-dialog">
    <form method="dialog">
      <div class="dialog-body">
        <p id="confirm-message">Are you sure?</p>
      </div>
      <div class="dialog-actions">
        <button type="button" class="button button-ghost" id="confirm-cancel">Cancel</button>
        <button type="submit" class="button button-primary" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>
</body>
</html>
